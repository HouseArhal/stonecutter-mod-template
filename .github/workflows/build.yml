name: build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    if: contains(github.event.head_commit.message, '-build') && !contains(github.event.head_commit.message, '-release')
    uses: ./.github/workflows/build_reusable.yml
